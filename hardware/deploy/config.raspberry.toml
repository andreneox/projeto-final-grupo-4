[application]
gateway_id = "__GATEWAY_ID__"
database_path = "/var/lib/lean-gateway/gateway.db"
log_path = "/var/log/lean-gateway/gateway.log"
timezone = "America/Manaus"

[ntp]
enabled = true
server = "__SERVER_ADDRESS__"
port = 123
timeout_seconds = 2.0
retry_interval_seconds = 10.0
sync_interval_seconds = 3600.0
apply_timeout_seconds = 5.0

[motor_output]
enabled = true
step_pin = 18
dir_pin = 25
en_pin = 15
minimum_frequency = 100.0
maximum_frequency = 5000.0
ramp_seconds = 0.5
clockwise_high = true
retry_interval_seconds = 2.0

[modbus]
enabled = true
port = "__SERIAL_PORT__"
baudrate = 115200
bytesize = 8
parity = "N"
stopbits = 1
device_id = 1
timeout_seconds = 0.2
retries = 2
reconnect_seconds = 2.0
poll_interval_seconds = 0.25

# Holding Register 0 maps to D1000; Input Register 100 maps to D100.
clock_address = 0
clock_apply_kind = "coil"
clock_apply_address = 1
clock_apply_active_value = 1
d100_address = 100
motor_speed_address = 200
line_control_address = 201
# D16052, com a área de Holding Registers iniciando em D1000.
production_count_address = 15052
# D1651–D1662, um WORD por posto de P01 a P12.
process_status_address = 651
event_byte_order = "big"
# Os tempos de 32 bits do CLP usam a palavra baixa primeiro e décimos de segundo.
uint32_word_order = "low_high"
time_scale_to_seconds = 0.1

# Coil 0 maps to P10000, bit 0 of word P1000.
ack_kind = "coil"
ack_address = 0
ack_active_value = 1
# D17001-D17288 in the PLC holding-register map.
cycle_base_address = 16001
# P10002 in the PLC coil map.
simulation_start_address = 2
# Coil 3 maps to P10003, the two-second reset request.
reset_base_address = 3
# Set simulation_running_address to the FC04 address of the 0/1 Ladder status.

[tcp]
host = "__SERVER_ADDRESS__"
port = 15000
connect_timeout_seconds = 5.0
send_timeout_seconds = 5.0
response_timeout_seconds = 5.0

[opcua]
enabled = true
endpoint = "opc.tcp://0.0.0.0:4840/mock-linha/"
namespace_uri = "urn:mock-linha:telemetria:v1"
application_uri = "urn:mock-linha:servidor"
certificate_path = "/etc/lean-gateway/certificates/server_cert.der"
private_key_path = "/etc/lean-gateway/certificates/server_key.pem"
trusted_clients_dir = "/etc/lean-gateway/certificates/trusted/clients"
