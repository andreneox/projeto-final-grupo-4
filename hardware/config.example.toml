[application]
gateway_id = "LINHA_A"
database_path = "data/gateway.db"
log_path = "logs/gateway.log"
timezone = "America/Manaus"

[ntp]
enabled = true
# IP or DNS name of the central server running an NTP/SNTP service.
server = "127.0.0.1"
port = 123
timeout_seconds = 2.0
retry_interval_seconds = 10.0
sync_interval_seconds = 3600.0
apply_timeout_seconds = 5.0

[motor_output]
# Enable only on the Raspberry Pi running the pigpio daemon.
enabled = false
step_pin = 18
dir_pin = 25
en_pin = 15
minimum_frequency = 100.0
maximum_frequency = 5000.0
ramp_seconds = 0.5
clockwise_high = true
retry_interval_seconds = 2.0

[modbus]
# Keep disabled until the XGK Modbus map and P10000 bit are confirmed.
enabled = false
port = "COM20" # Raspberry: /dev/serial/by-id/usb-...
baudrate = 115200
bytesize = 8
parity = "N"
stopbits = 1
device_id = 1
timeout_seconds = 0.2
retries = 2
reconnect_seconds = 2.0
poll_interval_seconds = 0.25

# Holding Register 0 maps to D1000; Input Register 100 maps to D100.
clock_address = 0
# Coil 1 maps to P10001. The PLC runs DATEWR D1000 and clears this bit.
clock_apply_kind = "coil"
clock_apply_address = 1
clock_apply_active_value = 1
d100_address = 100
# Holding Registers 200/201 map to D1200/D1201 with AO start at D1000.
motor_speed_address = 200
line_control_address = 201
event_byte_order = "big"
uint32_word_order = "high_low"
# Example for PLC values expressed in milliseconds. Confirm before enabling.
time_scale_to_seconds = 0.001

# Coil 0 maps to P10000, bit 0 of word P1000.
ack_kind = "coil" # coil or holding_register
ack_address = 0
ack_active_value = 1
cycle_base_address = 16001
simulation_start_address = 2
# Set simulation_running_address to the FC04 address of the 0/1 Ladder status.

[tcp]
host = "127.0.0.1"
port = 15000
connect_timeout_seconds = 5.0
send_timeout_seconds = 5.0
response_timeout_seconds = 5.0

[opcua]
enabled = true
endpoint = "opc.tcp://0.0.0.0:4840/mock-linha/"
namespace_uri = "urn:mock-linha:telemetria:v1"
application_uri = "urn:mock-linha:servidor"
certificate_path = "certificates/server_cert.der"
private_key_path = "certificates/server_key.pem"
trusted_clients_dir = "certificates/trusted/clients"
