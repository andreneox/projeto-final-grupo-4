<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instrução de Trabalho Digital · E07</title>
  <link rel="stylesheet" href="/static/styles.css?v=REV09">
</head>
<body class="instruction-page">
  <header class="instruction-header">
    <div><p>INSTRUÇÃO DE TRABALHO DIGITAL</p><h1>E07 · Montagem de Tubulação</h1></div>
    <div class="instruction-actions">
      <a href="/">Dashboard</a>
      <button id="instruction-fullscreen" type="button">Tela cheia</button>
      <strong id="instruction-status" role="status">Aguardando ciclo</strong>
    </div>
  </header>
  <main class="instruction-main">
    <p id="instruction-warning" class="instruction-warning" hidden></p>
    <div class="instruction-screen" aria-label="Slide da instrução do E07">
      <img id="instruction-slide-1" class="instruction-slide" src="/static/instructions/e07/slide-01.png" alt="Slide 01: Instrução de Trabalho E07, Montagem de Tubulação. Finalidade, condições de início e referência do ciclo.">
      <img id="instruction-slide-2" class="instruction-slide" src="/static/instructions/e07/slide-02.png" alt="Slide 02: Conferir unidade e kit. Leia a identificação, retire o kit correspondente e confira integridade e quantidade." hidden>
      <img id="instruction-slide-3" class="instruction-slide" src="/static/instructions/e07/slide-03.png" alt="Slide 03: Posicionar no gabarito. Acomode a tubulação na rota indicada, sem forçar o encaixe." hidden>
      <img id="instruction-slide-4" class="instruction-slide" src="/static/instructions/e07/slide-04.png" alt="Slide 04: Fixar as conexões. Siga a sequência aprovada e use a ferramenta e os parâmetros liberados para o modelo." hidden>
      <img id="instruction-slide-5" class="instruction-slide" src="/static/instructions/e07/slide-05.png" alt="Slide 05: Inspecionar e registrar. Confira rota, fixação e integridade, registre o resultado e libere somente a unidade OK." hidden>
    </div>
    <footer class="instruction-footer">
      <div><strong id="instruction-step">Slide 01 · Capa</strong><p id="instruction-message">Aguardando o início de um ciclo no E07.</p></div>
      <div class="instruction-time"><span id="instruction-elapsed">0,0 / 36,0 s</span><progress id="instruction-progress" value="0" max="36" aria-label="Tempo da sequência da instrução"></progress></div>
    </footer>
    <noscript>Ative o JavaScript para acompanhar os slides sincronizados ao ciclo do P07.</noscript>
  </main>
  <script src="/static/instruction.js?v=REV09" defer></script>
</body>
</html>
